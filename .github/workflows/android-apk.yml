name: Build Arabic Wallpapers APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArabicWallpapersNoAds-source/ArabicWallpapersNoAds/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ArabicWallpapersNoAds-source/ArabicWallpapersNoAds
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicWallpapersNoAds-debug-apk
          path: ArabicWallpapersNoAds-source/ArabicWallpapersNoAds/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
